<html lang="ko">
<header class="topbar">
<a class="logo" href="index.html">MY SITE</a>
<nav class="menu">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성우에 대한 모든 것</title>
<link rel="stylesheet" href="style.css">
</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's enjoy!!!</title>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">모드 변경</button>
    <style>
        * {
            box-sizing: border-box;
        }


        /* ===== 화면 전환 ===== */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* ===== 메뉴 화면 ===== */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .top h1 {
            font-size: 24px;
            margin: 0;
        }
        .top nav a {
            color: #ffd93d;
            text-decoration: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #16213e;
            padding: 25px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            transition: 0.2s;
            cursor: pointer;
            border: none;
            text-align: left;
            font-family: inherit;
            font-size: 16px;
        }
        .card:hover {
            transform: translateY(-6px);
            background-color: #1f2b4d;
        }
        .card h2 {
            color: #ffd93d;
            margin: 0 0 8px;
            font-size: 20px;
        }
        .card p {
            margin: 0;
            color: #a0a0a0;
            font-size: 14px;
        }

        /* ===== 게임 화면 공통 ===== */
        .game-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        .game-card {
            background-color: #16213e;
            width: 100%;
            max-width: 360px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-card h2 {
            color: #ffd93d;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .game-card input {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid transparent;
            text-align: center;
            margin-bottom: 15px;
            background-color: #0f172a;
            color: white;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .game-card input:focus {
            outline: none;
            border-color: #ffd93d;
            background-color: #1e293b;
        }

        .game-card button {
            width: 86%;
            padding: 12px;
            font-size: 16px;
            background-color: #ffd93d;
            color: #1a1a2e;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .game-card button:hover {
            background-color: #e6c235;
        }
        .game-card button:active {
            transform: scale(0.98);
        }

        .msg {
            margin-top: 25px;
            font-size: 17px;
            font-weight: bold;
            min-height: 24px;
            transition: color 0.3s ease;
            color: white;
        }
        .sub {
            color: #a0a0a0;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }

        /* 뒤로가기 버튼 */
        .back {
            background: none;
            border: none;
            color: #ffd93d;
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            margin-bottom: 20px;
            font-family: inherit;
        }
        .back:hover {
            text-decoration: underline;
        }

        /* ===== 클릭 게임 전용 ===== */
        .info-box {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 16px;
            font-weight: 600;
            color: #dddddd;
        }
        .info-box p {
            margin: 0;
        }
        #clkTime, #clkScore {
            font-size: 20px;
            color: #ffd93d;
        }

        .game-card button#clkBigBtn {
            padding: 25px;
            font-size: 18px;
            margin-top: 15px;
        }

        .game-card button:disabled {
            background-color: #2a3352;
            color: #666f8a;
            cursor: not-allowed;
            transform: none;
        }
        .game-card button:disabled:hover {
            background-color: #2a3352;
        }

        /* ===== 정답 애니메이션 ===== */
        @keyframes pop {
            0%   { transform: scale(0.5); opacity: 0; }
            60%  { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .correct {
            color: #4ade80;
            font-size: 22px;
            animation: pop 0.4s;
        }
        .wrong {
            color: #ff6b6b;
        }
    </style>

<body>
<script>
function toggleTheme() {
if (document.body.className === "light") {
document.body.className = "";
} else {
document.body.className = "light";
}
}
</script>
<!-- ============ 화면 1 : 메뉴 ============ -->
<div id="menu" class="page active">
    <main class="grid">
        <button class="card" onclick="showPage('numberGame')">
            <h2>숫자 맞히기</h2>
            <p>1~100 사이를 맞혀라</p>
        </button>

        <button class="card" onclick="showPage('clickGame')">
            <h2>클릭 게임</h2>
            <p>10초 안에 몇 번?</p>
        </button>

        <button class="card" onclick="showPage('rpsGame')">
            <h2>가위바위보</h2>
            <p>컴퓨터를 이겨라</p>
        </button>
    </main>
</div>

<!-- ============ 화면 2 : 숫자 맞히기 ============ -->
<div id="numberGame" class="page">
    <button class="back" onclick="showPage('menu')">&larr; 메뉴로</button>

    <div class="game-wrap">
        <section class="game-card">
            <h2>숫자 맞히기 (1~100)</h2>
            <input type="number" id="numGuess" min="1" max="100" placeholder="숫자를 적으세요">
            <br>
            <button onclick="checkNumber()">확인</button>
            <p id="numResult" class="msg">숫자를 입력하세요</p>
            <p id="numCount" class="sub">시도 : 0회</p>
        </section>
    </div>
</div>

<!-- ============ 화면 3 : 클릭 게임 ============ -->
<div id="clickGame" class="page">
    <button class="back" onclick="showPage('menu')">&larr; 메뉴로</button>

    <div class="game-wrap">
        <section class="game-card">
            <h2>10초 클릭 게임</h2>

            <div class="info-box">
                <p>남은 시간: <span id="clkTime">10</span>초</p>
                <p>점수: <span id="clkScore">0</span>점</p>
            </div>

            <button id="clkStartBtn" onclick="startClickGame()">게임 시작</button>
            <button id="clkBigBtn" onclick="clickPoint()" disabled>여기를 마구 눌러!</button>
        </section>
    </div>
</div>


<!-- ============ 화면 4 : 가위바위보 ============ -->
<div id="rpsGame" class="page">
    <button class="back" onclick="showPage('menu')">&larr; 메뉴로</button>

    <div class="game-wrap">
        <section class="game-card">
            <h2>가위바위보 게임</h2>
            <input type="text" id="rpsGuess" placeholder="가위, 바위, 보를 적으세요">
            <br>
            <button onclick="checkRPS()">확인</button>
            <p id="rpsResult" class="msg">단어를 입력하세요</p>
            <p id="rpsScore" class="sub">컴퓨터 0 : 0 사용자</p>
        </section>
    </div>
</div>


<script>
    /* ===== 화면 전환 ===== */
    function showPage(id) {
        // 다른 화면으로 넘어갈 때 클릭게임 타이머를 반드시 정리한다
        stopClickGame();

        var pages = document.getElementsByClassName('page');
        for (var i = 0; i < pages.length; i++) {
            pages[i].className = 'page';
        }
        document.getElementById(id).className = 'page active';
    }


    /* ===== 게임 1 : 숫자 맞히기 ===== */
    var answer = Math.floor(Math.random() * 100) + 1;
    var tries = 0;

    function checkNumber() {
        var guess = Number(document.getElementById('numGuess').value);
        var result = document.getElementById('numResult');
        var count = document.getElementById('numCount');

        if (!guess || guess < 1 || guess > 100) {
            result.innerText = '1부터 100 사이의 숫자를 넣으세요!';
            result.className = 'msg wrong';
            return;
        }

        tries = tries + 1;

        if (guess === answer) {
            result.innerText = '정답! ' + tries + '번 만에 맞췄어요!';
            result.className = 'msg correct';
        } else if (guess < answer) {
            result.innerText = '더 큰 숫자예요!';
            result.className = 'msg';
        } else {
            result.innerText = '더 작은 숫자예요!';
            result.className = 'msg';
        }

        count.innerText = '시도 : ' + tries + '회';
    }


    /* ===== 게임 2 : 클릭 게임 ===== */
    var clkScore = 0;
    var clkTime = 10;
    var clkTimer = null;

    function startClickGame() {
        if (clkTimer !== null) {
            clearInterval(clkTimer);
        }

        clkScore = 0;
        clkTime = 10;
        document.getElementById('clkScore').innerText = clkScore;
        document.getElementById('clkTime').innerText = clkTime;

        document.getElementById('clkStartBtn').disabled = true;
        document.getElementById('clkBigBtn').disabled = false;

        clkTimer = setInterval(function() {
            clkTime = clkTime - 1;
            document.getElementById('clkTime').innerText = clkTime;

            if (clkTime <= 0) {
                clearInterval(clkTimer);
                clkTimer = null;

                document.getElementById('clkBigBtn').disabled = true;

                var startBtn = document.getElementById('clkStartBtn');
                startBtn.innerText = "다시하기";
                startBtn.disabled = false;

                setTimeout(function() {
                    alert('끝! 최종 점수: ' + clkScore + '점');
                }, 50);
            }
        }, 1000);
    }

    function clickPoint() {
        clkScore = clkScore + 1;
        document.getElementById('clkScore').innerText = clkScore;
    }

    // 게임 도중 메뉴로 나갈 때 타이머를 멈추고 처음 상태로 되돌린다
    function stopClickGame() {
        if (clkTimer !== null) {
            clearInterval(clkTimer);
            clkTimer = null;
        }
        clkScore = 0;
        clkTime = 10;
        document.getElementById('clkScore').innerText = 0;
        document.getElementById('clkTime').innerText = 10;

        var startBtn = document.getElementById('clkStartBtn');
        startBtn.innerText = "게임 시작";
        startBtn.disabled = false;
        document.getElementById('clkBigBtn').disabled = true;
    }


    /* ===== 게임 3 : 가위바위보 ===== */
    var comScore = 0;
    var userScore = 0;

    function checkRPS() {
        var guess = document.getElementById('rpsGuess').value;
        var result = document.getElementById('rpsResult');
        var score = document.getElementById('rpsScore');

        var num = Math.floor(Math.random() * 3);
        var com = "";
        if (num === 0) {
            com = "가위";
        } else if (num === 1) {
            com = "바위";
        } else {
            com = "보";
        }

        if (guess !== "가위" && guess !== "바위" && guess !== "보") {
            result.innerText = "가위, 바위, 보 중에서만 입력해주세요!";
            result.className = 'msg wrong';
            return;
        }

        if (guess === com) {
            result.innerText = '비겼어요! 컴퓨터: ' + com;
            result.className = 'msg';
        } else if (
            (guess === "가위" && com === "보") ||
            (guess === "바위" && com === "가위") ||
            (guess === "보" && com === "바위")
        ) {
            result.innerText = '예! 컴퓨터를 이겼어요!';
            result.className = 'msg correct';
            userScore = userScore + 1;
        } else {
            result.innerText = '졌어요.. 컴퓨터: ' + com;
            result.className = 'msg';
            comScore = comScore + 1;
        }

        score.innerText = '컴퓨터 ' + comScore + ' : ' + userScore + ' 사용자';
    }
</script>
<script src="theme.js"></script>
</body>

<footer class="foot">
<p>2026 성우의 사이트</p>
<p>HTML · CSS · JavaScript로 만들었습니다</p>
</footer>
</html>
